<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Format Uploader</title>
</head>
<body>
  <h2>Send & Download Data</h2>
  
  <form id="dataForm">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" value="RenderUser" required>
    


    
    <label for="document">File (For form-data):</label>
    <input type="file" id="document" name="document">
    



    <button type="button" id="btnFormData">1. multipart/form-data</button>


    <button type="button" id="btnRelated">2. multipart/related</button>


    <button type="button" id="btnMixed">3. multipart/mixed</button>


    <button type="button" id="btnUrlEncoded">4. application/x-www-form-urlencoded</button>
  </form>

  <div style="margin-top: 20px; padding: 10px; background: #f0f0f0;">
    <strong>Server Response:</strong>
    <pre id="status">Waiting for input...</pre>
  </div>

  <div id="downloadArea" style="margin-top: 20px; display: none;">
    <strong>Success!</strong> 
    <a id="downloadLink" href="#" target="_blank" style="padding: 5px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 4px;">
      Download Your File
    </a>
  </div>

  <script src="./app.js"></script>
</body>
</html>
